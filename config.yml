# Native TabbyAPI configuration for the pinned Qwen3.8 27B EXL3 5.00 bpw H6 model.
# Launch from tabbyAPI/ with: python main.py --config ../config.yml
# ./scripts/setup rewrites host, port, model_dir, model_name, cache_mode and MTP
# settings. Relative paths resolve from tabbyAPI/, so "models" means tabbyAPI/models.
# Authentication is on: TabbyAPI writes generated keys to tabbyAPI/api_tokens.yml.
network:
  host: 127.0.0.1
  port: 8080
  disable_auth: false
  allowed_origins: []
  disable_fetch_requests: true
  api_servers: [OAI]
model:
  model_dir: models
  model_name: qwen3-8-27b-exl3-sc-5-00bpw-h6
  backend: exllamav3
  max_seq_len: 262144
  cache_size: 262144
  cache_mode: "8,4"
  max_batch_size: 1
  vision: true
  vision_offload: false
  tool_format: qwen3_coder
  tool_calls_in_reasoning: false
  reasoning: true
  reasoning_start_token: <think>
  reasoning_end_token: </think>
  start_in_reasoning: auto
draft_model:
  draft_mode: mtp
  draft_cache_mode: Q4
  draft_num_tokens: 3
